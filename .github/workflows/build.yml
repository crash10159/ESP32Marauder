name: Build Flipper Firmware
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Install ESP32 board
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
      - name: Install libraries
        run: |
          arduino-cli lib install "LinkedList"
          arduino-cli lib install "TFT_eSPI"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit NeoPixel"
      - name: Build
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s2 --build-property build.extra_flags="-DMARAUDER_FLIPPER -DARDUINO_USB_CDC_ON_BOOT=1" esp32_marauder/esp32_marauder.ino --output-dir build/
      - uses: actions/upload-artifact@v4
        with:
          name: marauder-flipper
          path: build/*.bin 
